{% extends 'base.html' %}
{% block title %}About Us{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <h2 class="mb-4"><i class="bi bi-building"></i> About Us</h2>
    <div class="card shadow-sm">
      <div class="card-body p-5 text-center">
        <i class="bi bi-capsule-pill text-success" style="font-size: 4rem;"></i>
        <h3 class="mt-4 fw-bold">의약품 중복 사용 검토 전문회사</h3>
        <p class="text-muted mt-3 fs-5">
          저희는 의약품 성분 중복 사용을 방지하여 환자의 안전한 의약품 사용을 돕는 전문 기업입니다.
        </p>
        <hr class="my-4">
        <div class="row text-start">
          <div class="col-md-6">
            <h5><i class="bi bi-check-circle-fill text-success"></i> 주요 서비스</h5>
            <ul class="list-unstyled mt-2">
              <li><i class="bi bi-arrow-right-short"></i> 의약품 중복 성분 분석</li>
              <li><i class="bi bi-arrow-right-short"></i> 의약품 정보 제공</li>
              <li><i class="bi bi-arrow-right-short"></i> 약물 상호작용 검토</li>
            </ul>
          </div>
          <div class="col-md-6">
            <h5><i class="bi bi-star-fill text-warning"></i> 특징</h5>
            <ul class="list-unstyled mt-2">
              <li><i class="bi bi-arrow-right-short"></i> 전문 의약품 데이터베이스</li>
              <li><i class="bi bi-arrow-right-short"></i> 빠르고 정확한 성분 비교</li>
              <li><i class="bi bi-arrow-right-short"></i> 안전한 의약품 사용 지원</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
