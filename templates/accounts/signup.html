{% extends 'base.html' %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0"><i class="bi bi-person-plus"></i> 회원가입</h4>
      </div>
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label class="form-label fw-semibold">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
              {% endif %}
            </div>
          {% endfor %}
          <div class="d-grid">
            <button type="submit" class="btn btn-success btn-lg">가입하기</button>
          </div>
        </form>
        <hr>
        <p class="text-center mb-0">
          이미 회원이신가요? <a href="{% url 'accounts:login' %}">로그인</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
