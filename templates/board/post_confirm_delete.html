{% extends 'base.html' %}
{% block title %}게시글 삭제{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0"><i class="bi bi-trash"></i> 게시글 삭제</h4>
      </div>
      <div class="card-body p-4 text-center">
        <p class="fs-5">아래 게시글을 삭제하시겠습니까?</p>
        <p class="fw-bold">「{{ post.title }}」</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-danger">
              <i class="bi bi-trash"></i> 삭제
            </button>
            <a href="{% url 'board:post_detail' post.pk %}" class="btn btn-outline-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
