{% extends 'base.html' %}
{% block title %}홈 - 의약품 정보 시스템{% endblock %}
{% block content %}
<div class="p-5 mb-4 bg-light rounded-3">
  <div class="container-fluid py-5 text-center">
    <h1 class="display-5 fw-bold"><i class="bi bi-capsule-pill text-success"></i> 의약품 정보 시스템</h1>
    <p class="col-md-8 fs-4 mx-auto mt-3 text-muted">의약품 중복 사용 검토 전문 서비스</p>
  </div>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4 mt-2">
  <div class="col">
    <div class="card h-100 shadow-sm">
      <div class="card-body text-center">
        <i class="bi bi-search-heart text-danger fs-1"></i>
        <h5 class="card-title mt-3">의약품 중복성분 보기</h5>
        <p class="card-text text-muted">약품을 선택하여 중복 성분을 비교해 보세요.</p>
        <a href="{% url 'medicines:duplicate_check' %}" class="btn btn-outline-danger" target="_blank" rel="noopener noreferrer">바로가기</a>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card h-100 shadow-sm">
      <div class="card-body text-center">
        <i class="bi bi-journal-medical text-primary fs-1"></i>
        <h5 class="card-title mt-3">의약정보 보기</h5>
        <p class="card-text text-muted">성분, 회사, 효능별로 의약품을 검색하세요.</p>
        <a href="{% url 'medicines:druginfo_list' %}" class="btn btn-outline-primary" target="_blank" rel="noopener noreferrer">바로가기</a>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="card h-100 shadow-sm">
      <div class="card-body text-center">
        <i class="bi bi-chat-square-text text-success fs-1"></i>
        <h5 class="card-title mt-3">게시판</h5>
        <p class="card-text text-muted">자유롭게 의견을 나눠보세요.</p>
        <a href="{% url 'board:post_list' %}" class="btn btn-outline-success">바로가기</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
